<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Placement tags placeholder</title>
  <desc id="desc">Placeholder showing region-specific DR Drill tag fields for alternate subnet OCID and alternate NSG OCIDs.</desc>
  <rect width="1200" height="675" fill="#f8f9fb"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="34" fill="#1f2937">Task 3 Placeholder</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="26" fill="#374151">Apply DR Drill placement tags</text>
  <rect x="110" y="215" width="980" height="325" rx="8" fill="#ffffff" stroke="#7d8793" stroke-width="2"/>
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="24" fill="#111827">FullStackDRDrill_&lt;REGION_KEY&gt;</text>
  <line x1="150" y1="300" x2="1030" y2="300" stroke="#d0d7de" stroke-width="2"/>
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="22" fill="#374151">FullStackDRDrill_&lt;REGION_KEY&gt;_SubnetId = ocid1.subnet...</text>
  <text x="150" y="400" font-family="Arial, sans-serif" font-size="22" fill="#374151">FullStackDRDrill_&lt;REGION_KEY&gt;_NSGId1 = ocid1.networksecuritygroup...</text>
  <text x="150" y="450" font-family="Arial, sans-serif" font-size="22" fill="#374151">FullStackDRDrill_&lt;REGION_KEY&gt;_NSGId2 = ocid1.networksecuritygroup...</text>
  <text x="150" y="500" font-family="Arial, sans-serif" font-size="22" fill="#374151">Scope = DR Drill only</text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Replace with OCI tag namespace and resource tag screenshots.</text>
</svg>
