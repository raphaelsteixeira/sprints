<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Standard FSDR VNIC mapping placeholder</title>
  <desc id="desc">Placeholder showing the standard source VNIC mapping for failover and switchover, with DR Drill tags providing alternate sandbox placement.</desc>
  <rect width="1200" height="675" fill="#f8f9fb"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="34" fill="#1f2937">Task 4 Placeholder</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="26" fill="#374151">Configure standard Full Stack DR VNIC mapping</text>
  <rect x="105" y="235" width="300" height="150" rx="8" fill="#e8f1ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="140" y="295" font-family="Arial, sans-serif" font-size="24" fill="#0f3767">Source VNIC</text>
  <text x="140" y="335" font-family="Arial, sans-serif" font-size="18" fill="#0f3767">Production Windows VM</text>
  <rect x="450" y="235" width="300" height="150" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="485" y="295" font-family="Arial, sans-serif" font-size="24" fill="#9a3412">Standard mapping</text>
  <text x="485" y="335" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">Failover / switchover</text>
  <rect x="795" y="235" width="300" height="150" rx="8" fill="#e9f8ef" stroke="#238636" stroke-width="2"/>
  <text x="830" y="295" font-family="Arial, sans-serif" font-size="24" fill="#155724">Recovery subnet</text>
  <text x="830" y="335" font-family="Arial, sans-serif" font-size="18" fill="#155724">Standard NSGs</text>
  <line x1="405" y1="310" x2="450" y2="310" stroke="#697386" stroke-width="4"/>
  <line x1="750" y1="310" x2="795" y2="310" stroke="#697386" stroke-width="4"/>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Replace with DR protection group member VNIC mapping screenshot. Drill tags are documented separately.</text>
</svg>
