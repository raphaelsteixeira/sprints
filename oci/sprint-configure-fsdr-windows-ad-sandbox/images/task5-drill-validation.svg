<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Drill validation placeholder</title>
  <desc id="desc">Placeholder showing drill validation results where the recovered Windows instance is in the sandbox subnet and Active Directory ports are blocked.</desc>
  <rect width="1200" height="675" fill="#f8f9fb"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="34" fill="#1f2937">Task 5 Placeholder</text>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="26" fill="#374151">Validate the drill sandbox</text>
  <rect x="95" y="215" width="470" height="300" rx="8" fill="#e9f8ef" stroke="#238636" stroke-width="2"/>
  <text x="130" y="270" font-family="Arial, sans-serif" font-size="24" fill="#155724">Placement checks</text>
  <text x="130" y="325" font-family="Arial, sans-serif" font-size="21" fill="#155724">[ ] VNIC in sandbox subnet</text>
  <text x="130" y="370" font-family="Arial, sans-serif" font-size="21" fill="#155724">[ ] Sandbox NSGs attached</text>
  <text x="130" y="415" font-family="Arial, sans-serif" font-size="21" fill="#155724">[ ] Drill plan succeeded</text>
  <rect x="635" y="215" width="470" height="300" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="270" font-family="Arial, sans-serif" font-size="24" fill="#991b1b">AD isolation checks</text>
  <text x="670" y="325" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">[ ] Domain discovery blocked</text>
  <text x="670" y="370" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">[ ] DNS to AD blocked</text>
  <text x="670" y="415" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">[ ] Kerberos, LDAP, SMB blocked</text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Replace with plan execution, VNIC details, and PowerShell validation screenshots.</text>
